apiVersion: v1
kind: ConfigMap
metadata:
  name: irodsfs-pool-config
  namespace: irodsfs-pool
data:
  config.yaml: |
    service_endpoint: tcp://0.0.0.0:12020
    debug: false
    data_root_path: /data/irodsfs-pool
    log_root_path: /data/irodsfs-pool/log
    log_max_backups: 10
    staging_root_path: /data/irodsfs-pool/staging

    recovery_encryption_key: ""  # required: base64-encoded 32-byte key

    session_timeout: 10m
    session_timeout_check_interval: 10s

    data_block_size: 4194304           # 4MB
    max_data_mem_cache_size: 107374182400  # 100GB
    max_data_mem_cache_buffer_items: 512
    data_mem_cache_ttl: 6h
    max_io_connection_per_session: 10
    start_new_transaction: false
    max_metadata_cache_entries_per_session: 1000000
    max_metadata_cache_size_per_session: 10485760  # 10MB
    max_metadata_cache_buffer_items_per_session: 256
    metadata_cache_ttl: 1m

    staging_data_grace_period: 10s
    max_staging_data_size: 536870912000  # 500GB

    operation_timeout: 5m

    packed_directories:
      enabled: true
      names: [
        ".git", ".venv", ".claude", ".codex", ".copilot", ".ansible", ".cache", ".docker", ".vscode", ".vscode-shared",
        ".ipynb_checkpoints", ".virtual_documents", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".tox", ".nox",
        ".pixi", ".conda", ".Rproj.user", ".spyproject", ".julia", ".dvc", ".nextflow", ".datalad", ".hydra", ".metaflow",
        ".idea", ".vs", ".metadata", ".history", ".gradle", ".m2", ".cargo", ".rustup", ".npm", ".yarn", ".pnpm-store",
        ".terraform", ".vagrant", ".next", ".nuxt", ".svelte-kit", ".turbo", ".parcel-cache", ".svn", ".hg", ".jj",
        ".local", ".apptainer", ".singularity", ".spack", ".lmod.d",
        "node_modules", "__pycache__", "mlruns", "wandb", "lightning_logs", "catboost_info", "site-packages"
      ]
      suffix: ".packedfs.tar"
      compression: none
      max_packed_dir_size: 5368709120  # 5GB
      snapshot_interval: 30m
      concurrent_pack_limit: 2

    management_service_endpoint: 0.0.0.0:12021
