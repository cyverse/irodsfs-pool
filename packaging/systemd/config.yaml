service_endpoint: tcp://0.0.0.0:12020
debug: false
data_root_path: /var/lib/irodsfs_pool
pid_file: /run/irodsfs-pool/irodsfs-pool.pid
log_root_path: /var/log/irodsfs-pool
staging_root_path: /irodsfs_pool/staging

recovery_encryption_key: ""  # required: base64-encoded 32-byte key

session_timeout: 10m
session_timeout_check_interval: 10s

data_block_size: 4194304           # 4MB
max_data_mem_cache_size: 107374182400  # 100GB
max_data_mem_cache_buffer_items: 512
data_mem_cache_ttl: 6h
max_io_connection_per_session: 10
start_new_transaction: false
max_metadata_cache_entries_per_session: 1000000
max_metadata_cache_size_per_session: 10485760  # 10MB
max_metadata_cache_buffer_items_per_session: 256
metadata_cache_ttl: 1m

staging_data_grace_period: 10s
max_staging_data_size: 536870912000 #500GB

operation_timeout: 5m

# Directories stored in iRODS as a single archive data object instead of as a
# collection. Uploading a tree of tens of thousands of small files costs one
# round trip per file; packing makes it one transfer.
#
# While a session uses such a directory it is held extracted on staging disk and
# every operation is served from there. It crosses the wire on first access, on
# each snapshot, and at session release. The directory is not browsable in iRODS
# on its own, so pack only directories that are not read directly there.
packed_directories:
  enabled: true
  names: [".git", ".venv", ".claude", ".codex", ".copilot", ".ansible", ".cache", ".docker", ".vscode", ".vscode-shared"]
  suffix: ".mount.tar"
  # none keeps the archive seekable and costs no CPU. The files in these
  # directories are usually already compressed, so gzip or zstd saves little.
  compression: none
  # Caps one packed directory. A larger archive is refused at mount, and a
  # write that would cross the line fails, which keeps the directory readable:
  # growing past the limit would make the next session unable to mount it.
  max_packed_dir_size: 5368709120  # 5GB
  # Bounds how much work a crash can lose. A negative value uploads at session
  # release only.
  snapshot_interval: 30m
  concurrent_pack_limit: 2

management_service_endpoint: 0.0.0.0:12021  # HTTP; `http://` is optional
