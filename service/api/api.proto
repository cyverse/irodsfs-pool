syntax = "proto3";

option go_package = "/api";

package api;

message Empty {
}

message SSLConfiguration{
	string ca_certificate_file = 1;
	string ca_certificate_path = 2;
	int32 encryption_key_size = 3;
	string encryption_algorithm = 4;
	int32 encryption_salt_size = 5;
	int32 encryption_num_hash_rounds = 6;
	string verify_server = 7;
	string dh_params_file = 8;
	string server_name = 9;
}

message Account{
	string authentication_scheme = 1;
	bool client_server_negotiation = 2;
	string cs_negotiation_policy = 3;
	string host = 4;
	int32 port = 5;
	string client_user = 6;
	string client_zone = 7;
	string proxy_user = 8;
	string proxy_zone = 9;
	string password = 10;
	string ticket = 11;
	string default_resource = 12;
	string default_hash_scheme = 13;
	int32 pam_ttl = 14;
	string pam_token = 15;
	SSLConfiguration ssl_configuration = 16;
}

message Entry {
	int64 id = 1;
	string type = 2;
	string name = 3;
	string path = 4;
	string owner = 5;
	int64 size = 6;
	string data_type = 7;
	string create_time = 8;
	string modify_time = 9;
	string access_time = 10;
	string checksum_algorithm = 11;
	bytes checksum = 12;
}

message LoginRequest{
	Account account = 1;
	string application_name = 2;
	string description = 3;
}

message LoginResponse{
	string session_id = 1;
}

message LogoutRequest{
	string session_id = 1;
}

message KeepAliveRequest{
	string session_id = 1;
}

message ListRequest {
	string session_id = 1;
	string path = 2;
}

message ListResponse {
	repeated Entry entries = 1;
}

message StatRequest {
	string session_id = 1;
	string path = 2;
}

message StatResponse {
	Entry entry = 1;
}

message ExistsDirRequest {
	string session_id = 1;
	string path = 2;
}

message ExistsDirResponse {
	bool exist = 1;
}

message ExistsFileRequest {
	string session_id = 1;
	string path = 2;
}

message ExistsFileResponse {
	bool exist = 1;
}

message RemoveFileRequest {
	string session_id = 1;
	string path = 2;
	bool force = 3;
}

message RemoveDirRequest {
	string session_id = 1;
	string path = 2;
	bool recurse = 3;
	bool force = 4;
}

message MakeDirRequest {
	string session_id = 1;
	string path = 2;
	bool recurse = 3;
}

message RenameDirToDirRequest {
	string session_id = 1;
	string source_path = 2;
	string destination_path = 3;
}

message RenameFileToFileRequest {
	string session_id = 1;
	string source_path = 2;
	string destination_path = 3;
}

message CreateFileRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message CreateFileResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message OpenFileRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message OpenFileResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message CreateFileBulkRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message CreateFileBulkResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message OpenFileBulkRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message OpenFileBulkResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message TruncateFileRequest {
	string session_id = 1;
	string path = 2;
	int64 size = 3;
}

message ReadAtRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 offset = 3;
	int32 length = 4;
}

message ReadAtResponse {
	bytes data = 1;
}

message WriteAtRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 offset = 3;
	bytes data = 4;
}

message WriteAtResponse {
	int32 length = 1;
}

message GetAvailableRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 offset = 3;
}

message GetAvailableResponse {
	int64 available = 1;
}

message ReadStreamRequest {
	string session_id = 1;
	string irods_path = 2;
	int32 block_size = 3;
	int32 num_blocks = 4;
}

message ReadStreamResponse {
	bytes data = 1;
	int64 offset = 2;
}

message ReadStreamParallelRequest {
	string session_id = 1;
	string irods_path = 2;
	int32 block_size = 3;
	int32 num_blocks = 4;
	int32 task_num = 5;
}

message ReadStreamParallelResponse {
	bytes data = 1;
	int64 offset = 2;
}

message WriteStreamRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 offset = 3;
	bytes data = 4;
}

message WriteStreamResponse {
	int64 written = 1;
}

message TruncateRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 size = 3;
}

message FlushRequest {
	string session_id = 1;
	string file_handle_id = 2;
}

message CloseRequest {
	string session_id = 1;
	string file_handle_id = 2;
}

message CacheFileRequest {
	string session_id = 1;
	string irods_path = 2;
	bool async = 3;
}

message SyncRequest {
	string session_id = 1;
}

service PoolAPI {
	// Session
	rpc Login(LoginRequest) returns (LoginResponse) {}
	rpc Logout(LogoutRequest) returns (Empty) {}
	rpc KeepAlive(KeepAliveRequest) returns (Empty) {}

	// Filesystem
	rpc List(ListRequest) returns (ListResponse) {}
	rpc Stat(StatRequest) returns (StatResponse) {}
	rpc ExistsDir(ExistsDirRequest) returns (ExistsDirResponse) {}
	rpc ExistsFile(ExistsFileRequest) returns (ExistsFileResponse) {}
	rpc RemoveFile(RemoveFileRequest) returns (Empty) {}
	rpc RemoveDir(RemoveDirRequest) returns (Empty) {}
	rpc MakeDir(MakeDirRequest) returns (Empty) {}
	rpc RenameDirToDir(RenameDirToDirRequest) returns (Empty) {}
	rpc RenameFileToFile(RenameFileToFileRequest) returns (Empty) {}
	rpc CreateFile(CreateFileRequest) returns (CreateFileResponse) {}
	rpc OpenFile(OpenFileRequest) returns (OpenFileResponse) {}
	rpc CreateFileBulk(CreateFileBulkRequest) returns (CreateFileBulkResponse) {}
	rpc OpenFileBulk(OpenFileBulkRequest) returns (OpenFileBulkResponse) {}
	rpc TruncateFile(TruncateFileRequest) returns (Empty) {}

	// File handle (RDWR pass-through)
	rpc ReadAt(ReadAtRequest) returns (ReadAtResponse) {}
	rpc WriteAt(WriteAtRequest) returns (WriteAtResponse) {}
	rpc GetAvailable(GetAvailableRequest) returns (GetAvailableResponse) {}
	rpc Truncate(TruncateRequest) returns (Empty) {}
	rpc Flush(FlushRequest) returns (Empty) {}
	rpc Close(CloseRequest) returns (Empty) {}

	// File handle streaming (RDONLY - server streams 4MB blocks for prefetch)
	rpc ReadStream(ReadStreamRequest) returns (stream ReadStreamResponse) {}
	// File streaming (RDONLY - server reads in parallel and streams blocks)
	rpc ReadStreamParallel(ReadStreamParallelRequest) returns (stream ReadStreamParallelResponse) {}
	// File handle streaming (WRONLY - client streams micro-buffered chunks)
	rpc WriteStream(stream WriteStreamRequest) returns (WriteStreamResponse) {}

	// Cache
	rpc CacheFile(CacheFileRequest) returns (Empty) {}

	// Sync
	rpc Sync(SyncRequest) returns (Empty) {}
}
