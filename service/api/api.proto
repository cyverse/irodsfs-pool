syntax = "proto3";

option go_package = "github.com/cyverse/irodsfs-pool/service/api;api";

package api;

import "google/protobuf/timestamp.proto";

message Empty {
}

message Account {
  optional string irods_authentication_scheme = 1;
  optional bool irods_client_server_negotiation = 2;
  optional string irods_client_server_policy = 3;
  string irods_host = 4;
  int32 irods_port = 5;
  string irods_zone_name = 6;
  optional string irods_client_zone_name = 7;
  string irods_user_name = 8;
  optional string irods_client_user_name = 9;
  optional string irods_default_resource = 10;
  optional string irods_cwd = 11;
  optional string irods_home = 12;
  optional string irods_default_hash_scheme = 13;
  optional string irods_match_hash_policy = 14;
  optional string irods_encryption_algorithm = 15;
  optional int32 irods_encryption_key_size = 16;
  optional int32 irods_encryption_salt_size = 17;
  optional int32 irods_encryption_num_hash_rounds = 18;
  optional string irods_ssl_ca_certificate_file = 19;
  optional string irods_ssl_ca_certificate_path = 20;
  optional string irods_ssl_verify_server = 21;
  optional string irods_ssl_certificate_chain_file = 22;
  optional string irods_ssl_certificate_key_file = 23;
  optional string irods_ssl_dh_params_file = 24;
  optional string irods_user_password = 25;
  optional string irods_ticket = 26;
  optional string irods_pam_token = 27;
  optional int32 irods_pam_ttl = 28;
  optional string irods_ssl_server_name = 29;
}

message Entry {
	int64 id = 1;
	string type = 2;
	string name = 3;
	string path = 4;
	string owner = 5;
	int64 size = 6;
	string data_type = 7;
	google.protobuf.Timestamp create_time = 8;
	google.protobuf.Timestamp modify_time = 9;
	google.protobuf.Timestamp access_time = 10;
	string checksum_algorithm = 11;
	bytes checksum = 12;
}

message LoginRequest{
	Account account = 1;
	string application_name = 2;
	string description = 3;
}

message LoginResponse{
	string session_id = 1;
}

message LogoutRequest{
	string session_id = 1;
}

message KeepAliveRequest{
	string session_id = 1;
}

message ListRequest {
	string session_id = 1;
	string path = 2;
}

message ListResponse {
	repeated Entry entries = 1;
}

message StatRequest {
	string session_id = 1;
	string path = 2;
}

message StatResponse {
	Entry entry = 1;
}

message ExistsDirRequest {
	string session_id = 1;
	string path = 2;
}

message ExistsDirResponse {
	bool exist = 1;
}

message ExistsFileRequest {
	string session_id = 1;
	string path = 2;
}

message ExistsFileResponse {
	bool exist = 1;
}

message RemoveFileRequest {
	string session_id = 1;
	string path = 2;
	bool force = 3;
}

message RemoveDirRequest {
	string session_id = 1;
	string path = 2;
	bool recurse = 3;
	bool force = 4;
}

message MakeDirRequest {
	string session_id = 1;
	string path = 2;
	bool recurse = 3;
}

message RenameDirToDirRequest {
	string session_id = 1;
	string source_path = 2;
	string destination_path = 3;
}

message RenameFileToFileRequest {
	string session_id = 1;
	string source_path = 2;
	string destination_path = 3;
}

message CreateFileRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message CreateFileResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message OpenFileRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message OpenFileResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message CreateFileBulkRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message CreateFileBulkResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message OpenFileBulkRequest {
	string session_id = 1;
	string path = 2;
	string mode = 3;
}

message OpenFileBulkResponse {
	string file_handle_id = 1;
	Entry entry = 2;
}

message TruncateFileRequest {
	string session_id = 1;
	string path = 2;
	int64 size = 3;
}

message ReadAtRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 offset = 3;
	int32 length = 4;
}

message ReadAtResponse {
	bytes data = 1;
}

message WriteAtRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 offset = 3;
	bytes data = 4;
}

message WriteAtResponse {
	int32 length = 1;
}

message GetAvailableRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 offset = 3;
}

message GetAvailableResponse {
	int64 available = 1;
}

message ReadStreamRequest {
	string session_id = 1;
	string irods_path = 2;
	int32 block_size = 3;
	int32 num_blocks = 4;
}

message ReadStreamResponse {
	bytes data = 1;
	int64 offset = 2;
}

message ReadStreamParallelRequest {
	string session_id = 1;
	string irods_path = 2;
	int32 block_size = 3;
	int32 num_blocks = 4;
	int32 task_num = 5;
}

message ReadStreamParallelResponse {
	bytes data = 1;
	int64 offset = 2;
}

message WriteStreamHeader {
	string session_id = 1;
	string irods_path = 2;
}

message WriteStreamBlock {
	int64 offset = 1;
	bytes data = 2;
}

message WriteStreamRequest {
	reserved 1 to 4;
	reserved "session_id", "file_handle_id", "offset", "data";

	oneof payload {
		WriteStreamHeader header = 5;
		WriteStreamBlock block = 6;
	}
}

message WriteStreamResponse {
	int64 written = 1;
}

message TruncateRequest {
	string session_id = 1;
	string file_handle_id = 2;
	int64 size = 3;
}

message FlushRequest {
	string session_id = 1;
	string file_handle_id = 2;
}

message CloseRequest {
	string session_id = 1;
	string file_handle_id = 2;
}

message CacheFileRequest {
	string session_id = 1;
	string irods_path = 2;
	bool async = 3;
}

message SyncRequest {
	string session_id = 1;
}

service PoolAPI {
	// Session
	rpc Login(LoginRequest) returns (LoginResponse) {}
	rpc Logout(LogoutRequest) returns (Empty) {}
	rpc KeepAlive(KeepAliveRequest) returns (Empty) {}

	// Filesystem
	rpc List(ListRequest) returns (ListResponse) {}
	rpc Stat(StatRequest) returns (StatResponse) {}
	rpc ExistsDir(ExistsDirRequest) returns (ExistsDirResponse) {}
	rpc ExistsFile(ExistsFileRequest) returns (ExistsFileResponse) {}
	rpc RemoveFile(RemoveFileRequest) returns (Empty) {}
	rpc RemoveDir(RemoveDirRequest) returns (Empty) {}
	rpc MakeDir(MakeDirRequest) returns (Empty) {}
	rpc RenameDirToDir(RenameDirToDirRequest) returns (Empty) {}
	rpc RenameFileToFile(RenameFileToFileRequest) returns (Empty) {}
	rpc CreateFile(CreateFileRequest) returns (CreateFileResponse) {}
	rpc OpenFile(OpenFileRequest) returns (OpenFileResponse) {}
	rpc CreateFileBulk(CreateFileBulkRequest) returns (CreateFileBulkResponse) {}
	rpc OpenFileBulk(OpenFileBulkRequest) returns (OpenFileBulkResponse) {}
	rpc TruncateFile(TruncateFileRequest) returns (Empty) {}

	// File handle (RDWR pass-through)
	rpc ReadAt(ReadAtRequest) returns (ReadAtResponse) {}
	rpc WriteAt(WriteAtRequest) returns (WriteAtResponse) {}
	rpc GetAvailable(GetAvailableRequest) returns (GetAvailableResponse) {}
	rpc Truncate(TruncateRequest) returns (Empty) {}
	rpc Flush(FlushRequest) returns (Empty) {}
	rpc Close(CloseRequest) returns (Empty) {}

	// File handle streaming (RDONLY - server streams 4MB blocks for prefetch)
	rpc ReadStream(ReadStreamRequest) returns (stream ReadStreamResponse) {}
	// File streaming (RDONLY - server reads in parallel and streams blocks)
	rpc ReadStreamParallel(ReadStreamParallelRequest) returns (stream ReadStreamParallelResponse) {}
	// File handle streaming (WRONLY - client streams micro-buffered chunks)
	rpc WriteStream(stream WriteStreamRequest) returns (WriteStreamResponse) {}

	// Cache
	rpc CacheFile(CacheFileRequest) returns (Empty) {}

	// Sync
	rpc Sync(SyncRequest) returns (Empty) {}
}
